name: build-configurations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      FLAKE_INPUTS_TOKEN:
        description: GitHub credential with read access to private flake inputs
        required: false
    inputs:
      revision:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      configurations: ${{ steps.matrix.outputs.configurations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Discover configurations and their native runners
        id: matrix
        run: |
          matrix=$(nix eval --json --no-write-lock-file --option allow-import-from-derivation false .#ciMatrix)
          echo "configurations=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.FLAKE_INPUTS_TOKEN || github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Enable namespaces for Lix sandbox tests
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor restriction prevents nested sandbox tests in Lix.
          # Change only the disposable CI VM; keep Nix sandboxing and tests enabled.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount true
      - name: Free macOS build space
        if: runner.os == 'macOS'
        run: |
          # Zed's source build needs space occupied by unused runner toolchains.
          # Retain the selected Xcode and its SDKs for native builds.
          selected_xcode=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for xcode_app in /Applications/Xcode*.app; do
            if [[ -d "$xcode_app" && ! -L "$xcode_app" && "$xcode_app" != "$selected_xcode" ]]; then
              sudo rm -rf "$xcode_app"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator
          df -h / /nix
      - name: Build configuration without activation
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/build-configuration.sh
