name: build-configurations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      FLAKE_INPUTS_TOKEN:
        description: GitHub credential with read access to private flake inputs
        required: false
    inputs:
      revision:
        description: Exact commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      configurations: ${{ steps.matrix.outputs.configurations }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      # Lix preserves the tarball revision URLs written by local lock updates.
      - uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9 # latest branch; no release tags
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Discover configurations and their native runners
        id: matrix
        run: |
          matrix=$(nix eval --json --no-write-lock-file --option allow-import-from-derivation false .#ciMatrix)
          echo "configurations=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9 # latest branch; no release tags
        with:
          github_access_token: ${{ secrets.FLAKE_INPUTS_TOKEN || github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Enable namespaces for Lix sandbox tests
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor restriction prevents nested sandbox tests in Lix.
          # Change only the disposable CI VM; keep Nix sandboxing and tests enabled.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount true
      - name: Enable KVM for NixOS VM tests
        if: runner.os == 'Linux'
        run: |
          # x86-64 runners expose /dev/kvm; the NixOS tests in ciVmTests need it.
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo 'extra-system-features = kvm nixos-test' | sudo tee -a /etc/nix/nix.conf
            sudo systemctl restart nix-daemon
          fi
      - name: Free macOS build space
        if: runner.os == 'macOS'
        run: |
          # Zed's source build needs space occupied by unused runner toolchains.
          # Retain the selected Xcode and its SDKs for native builds.
          selected_xcode=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for xcode_app in /Applications/Xcode*.app; do
            if [[ -d "$xcode_app" && ! -L "$xcode_app" && "$xcode_app" != "$selected_xcode" ]]; then
              sudo rm -rf "$xcode_app"
            fi
          done
          sudo rm -rf /Library/Developer/CoreSimulator
          df -h / /nix
      - name: Build target without activation
        env:
          TARGET: ${{ matrix.target }}
          CHECKS: ${{ matrix.checks }}
          # Cargo sources contain LFS pointers; fetching example media changes them.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: bash .github/scripts/build-configuration.sh
