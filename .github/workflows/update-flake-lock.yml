name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC.

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update-flake-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9 # latest branch; no release tags
        with:
          github_access_token: ${{ secrets.FLAKE_INPUTS_TOKEN || github.token }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Update flake.lock and open a pull request
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          branch: update_flake_lock_action
          pr-title: "Automated action - Update flake.lock"
          pr-labels: |
            dependencies
            automated
          pr-body: |
            Automated daily flake input update.

            Configuration builds run in the [update workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            {{ env.GIT_COMMIT_MESSAGE }}

      - name: Resolve the update commit
        id: revision
        if: steps.update.outputs.pull-request-number != '' && steps.update.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.update.outputs.pull-request-number }}
        run: |
          revision=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          echo "sha=$revision" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
  build:
    needs: update-flake-lock
    if: needs.update-flake-lock.outputs.revision != ''
    uses: ./.github/workflows/build-configurations.yml
    secrets:
      FLAKE_INPUTS_TOKEN: ${{ secrets.FLAKE_INPUTS_TOKEN }}
    with:
      revision: ${{ needs.update-flake-lock.outputs.revision }}
