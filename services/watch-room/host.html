<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie night · Host</title><link rel="stylesheet" href="style.css"><script defer src="host.js"></script></head><body><main><h1>Movie night</h1><p class="muted">Only this page controls playback. Friends need the guest link.</p><label for="movie">Movie</label><select id="movie"></select><section><button id="start">Start screening</button><button id="stop">End screening</button></section><p id="message" role="status"></p><a id="guest" target="_blank" rel="noreferrer"></a><section><button id="play">Play</button><button id="pause">Pause</button></section><label for="seek" id="position">Playback position</label><input id="seek" type="range" min="0" max="1" value="0" step="1"><p class="muted">Seeking briefly prepares a new stream for everyone. Ending a screening revokes its link. Links also expire after 12 hours.</p></main></body></html>
