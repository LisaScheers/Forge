version: 1
metadata:
  name: Home Assistant OIDC
entries:
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: Home Assistant owner role
    id: home-assistant-role
    attrs:
      scope_name: home-assistant
      expression: |
        return {"groups": ["home-assistant-owners"] if request.user.username == "lisa" else []}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Home Assistant
    id: home-assistant-provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: public
      grant_types:
        - authorization_code
      client_id: home-assistant
      redirect_uris:
        - matching_mode: strict
          url: https://ha.bylisa.dev/auth/oidc/callback
        - matching_mode: strict
          url: https://ha.local.bylisa.dev/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
        - !KeyOf home-assistant-role
  - model: authentik_core.application
    identifiers:
      slug: home-assistant
    id: home-assistant-application
    attrs:
      name: Home Assistant
      provider: !KeyOf home-assistant-provider
      meta_launch_url: https://ha.bylisa.dev/
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf home-assistant-application
      order: 0
    attrs:
      user: !Find [authentik_core.user, [username, lisa]]
