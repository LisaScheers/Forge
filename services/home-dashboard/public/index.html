<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#241943">
  <title>Home · Lisa</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" aria-label="Lisa's home"><span class="brand-icon">✳</span> lisa<span class="brand-dot">.</span></a>
      <div class="account"><span id="user"></span><a id="auth" class="auth" href="/login">Sign in <span aria-hidden="true">↗</span></a></div>
    </header>
    <section class="intro">
      <div class="eyebrow">YOUR LITTLE CORNER OF THE INTERNET</div>
      <h1>Make yourself<br>at home<span class="brand-dot">.</span></h1>
      <p id="welcome">Public services, all in one place. Sign in for the rest.</p>
      <svg class="orbit" viewBox="0 0 220 220" fill="none" aria-hidden="true"><circle cx="110" cy="110" r="68"/><ellipse cx="110" cy="110" rx="100" ry="37" transform="rotate(-35 110 110)"/><ellipse cx="110" cy="110" rx="100" ry="37" transform="rotate(35 110 110)"/><path d="M110 71v78M71 110h78M82 82l56 56M138 82l-56 56"/><circle cx="190" cy="62" r="8" class="planet"/><circle cx="37" cy="162" r="5" class="planet"/></svg>
    </section>
    <div class="toolbar">
      <div class="filters" aria-label="Filter services"><button class="selected" id="all" type="button" aria-pressed="true">All services <span id="total">—</span></button><button id="issues" type="button" aria-pressed="false">Issues <span id="issue-count">—</span></button></div>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Find your service…" aria-label="Search services" autocomplete="off"><kbd>/</kbd></label>
    </div>
    <div id="notice" role="status" aria-live="polite">Checking services…</div>
    <div id="services"></div>
    <footer><span id="updated">Waiting for status</span><span>Made a home, by Lisa <span aria-hidden="true">✳</span></span></footer>
    <noscript><p>Enable JavaScript to load service links and status. <a href="/login">Sign in with Authentik</a>.</p></noscript>
  </main>
</body>
</html>
